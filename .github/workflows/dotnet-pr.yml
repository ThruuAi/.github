# The PR lane for a .NET repository: ONE job, one runner, one run per push.
#
#   restore (token) -> build -> unit tests -> optional filtered integration tests
#
# Called from a thin `pr.yml` in each repository (CI rebuild plan, 2026-11-09). The
# caller owns the trigger, the draft skip, the concurrency group and the path
# handling; this file owns what runs. The check a ruleset requires is
# `<caller job name> / ci`, so a caller whose job is named `pr` produces `pr / ci`.
#
# Deliberately NOT here: a custom trust gate, a budget, a load factor, a retry loop,
# a `workflow_run` fan-out. A red test is red. The merge and nightly lanes
# (dotnet-split-suite.yml) carry everything that does not fit in ten minutes.
#
# SECURITY. Read-only token. The package-feed secret reaches the RESTORE step only,
# so the build and the tests of the pull request's own code run without it. Nothing
# here is specific to one organisation's infrastructure, because this repository is
# public. Callers pin this file by commit SHA.
name: dotnet-pr

on:
  workflow_call:
    inputs:
      solution:
        description: Path of the solution (or project) to restore and build.
        type: string
        required: true
      unit-projects:
        description: Test projects run in full, space or newline separated.
        type: string
        required: true
      integration-projects:
        description: Test projects that take the integration filter, space or newline separated.
        type: string
        required: false
        default: ""
      integration-filter:
        description: >-
          `dotnet test --filter` expression for the integration projects. Empty means no
          integration tests run in this lane (Testcontainers is available on ubuntu-24.04).
        type: string
        required: false
        default: ""
      msbuild-args:
        description: Extra MSBuild arguments for restore and build (for example -p:Name=value).
        type: string
        required: false
        default: ""
      docs-only-regex:
        description: >-
          Extended regex. When EVERY file changed by the pull request matches it, the job
          reports success after the checkout and runs nothing else. The job still reports, so
          a required check is never left pending (a workflow-level `paths-ignore` would).
          Empty means never skip.
        type: string
        required: false
        default: ""
      cache-dependency-path:
        description: Files whose hash keys the NuGet cache (one glob per line).
        type: string
        required: false
        default: |
          **/packages.lock.json
          **/Directory.*.props
          **/*.csproj
          global.json
      timeout-minutes:
        description: Job timeout.
        type: number
        required: false
        default: 15
      runner:
        description: Runner label.
        type: string
        required: false
        default: ubuntu-24.04
    secrets:
      GH_PACKAGES_TOKEN:
        description: Read-only token for the private package feed (read:packages).
        required: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      MSBUILDDISABLENODEREUSE: "1"
    steps:
      - name: Checkout (the pull request merged into its base)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Docs-only change
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          IGNORE_REGEX: ${{ inputs.docs-only-regex }}
        run: |
          set -euo pipefail
          skip=false
          # On a pull_request the checkout is the merge commit: HEAD^1 is the base tip and
          # HEAD^2 the pull request head, so this diff is exactly what the pull request changes.
          if [ "$EVENT" = "pull_request" ] && [ -n "$IGNORE_REGEX" ] && git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            files="$(git diff --name-only 'HEAD^1' HEAD)"
            # grep -v keeps the files that do NOT match; none left means every file is ignorable.
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -Eqv -- "$IGNORE_REGEX"; then
              skip=true
              echo "Every changed file matches the docs-only pattern; nothing to build."
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Setup .NET (SDK from global.json, NuGet cache)
        if: steps.scope.outputs.skip != 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      # The ONLY step that sees the package token. Build and tests below run without it.
      - name: Restore
        if: steps.scope.outputs.skip != 'true'
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          SOLUTION: ${{ inputs.solution }}
          MSBUILD_ARGS: ${{ inputs.msbuild-args }}
        run: |
          set -euo pipefail
          read -r -a extra <<< "$MSBUILD_ARGS"
          dotnet restore "$SOLUTION" --nologo -v q "${extra[@]}"

      # Warnings are errors where the repository's own Directory.Build.props says so.
      - name: Build (Release)
        if: steps.scope.outputs.skip != 'true'
        env:
          SOLUTION: ${{ inputs.solution }}
          MSBUILD_ARGS: ${{ inputs.msbuild-args }}
        run: |
          set -euo pipefail
          read -r -a extra <<< "$MSBUILD_ARGS"
          dotnet build "$SOLUTION" -c Release --no-restore --nologo -v q "${extra[@]}"

      - name: Unit tests
        if: steps.scope.outputs.skip != 'true'
        env:
          PROJECTS: ${{ inputs.unit-projects }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trx"
          rc=0
          for p in $PROJECTS; do
            name="$(basename "$p" .csproj)"
            echo "::group::dotnet test $name"
            dotnet test "$p" --no-build --no-restore -c Release --nologo \
              --logger "trx;LogFileName=$name.trx" --results-directory "$RUNNER_TEMP/trx/$name" || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

      - name: Integration tests (filtered)
        if: steps.scope.outputs.skip != 'true' && inputs.integration-filter != '' && inputs.integration-projects != ''
        env:
          PROJECTS: ${{ inputs.integration-projects }}
          FILTER: ${{ inputs.integration-filter }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trx"
          rc=0
          for p in $PROJECTS; do
            name="$(basename "$p" .csproj)"
            echo "::group::dotnet test $name (filtered)"
            dotnet test "$p" --no-build --no-restore -c Release --nologo --filter "$FILTER" \
              --logger "trx;LogFileName=$name.trx" --results-directory "$RUNNER_TEMP/trx/$name" || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

      - name: Upload test results (failure only)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trx-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trx/**
          if-no-files-found: ignore
          retention-days: 7
