# Tests for this repository's own governance code. Public repository, so the
# hosted runner costs nothing. No paths filter: it must report on every pull
# request to be requirable.
name: Governance tests

on:
  pull_request:
    branches: [test, main]

permissions:
  contents: read

jobs:
  tests:
    name: governance tests
    # Pin ahead of GitHub's ubuntu-latest migration (2026-10-19 to 2026-11-19):
    # https://github.blog/changelog/2026-09-17-ubuntu-26-generally-available-and-latest-migration/
    runs-on: ubuntu-24.04
    # 8 minutes: the job took about 190 s and the PR lane v2 proofs (ThruuAi/.github#9) add about 1.5 minutes on 2 cores;
    # the first run of #10 hit the old 5 minute limit inside its mutation proof (run 43410741021, cancelled, not red).
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: issue-link matcher
        run: node governance/tests/issue-link.test.js
      - name: issue-link identity, mutation proof
        run: node governance/tests/issue-link.mutations.js
      - name: source-policy matcher
        run: node governance/tests/source-policy.test.js
      - name: source-policy identity, mutation proof
        run: node governance/tests/source-policy.mutations.js
      - name: areas checker
        run: node governance/tests/areas-check.test.js
      - name: governance pin anchors (ThruuAi/.github test), mutation proof
        run: node governance/tests/pin-anchor.test.js
      - name: PR governance pin check
        run: node governance/tests/pr-governance.test.js
      - name: issue-link publisher (Checks App workflow)
        run: node governance/tests/issue-link-publish.test.js
      - name: issue-link publisher, mutation proof
        run: node governance/tests/issue-link-publish.mutations.js
      - name: merge-on-accept (judge, recheck and inline scripts, fake API; ThruuAi/.github#22)
        run: node governance/tests/merge-on-accept.test.js
      - name: merge-on-accept, mutation proof
        run: node governance/tests/merge-on-accept.mutations.js
      - name: bootstrap (stub gh, no network)
        run: node governance/tests/bootstrap.test.js
      # The identity suite starts zsh as login and interactive shells, as the
      # agent CLIs do; the runner image has no zsh, and a skipped case would pass.
      - name: zsh, for the identity suite
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh && zsh --version
      - name: agent identity (stub curl and gh, no network)
        env:
          IDENTITY_REQUIRE_ZSH: '1'
        run: node governance/tests/identity.test.js
      - name: split-suite workflow (job-private .NET state, runner group)
        run: python3 governance/tests/split-suite-workflow.test.py
      - name: split-suite workflow, mutation proof
        run: python3 governance/tests/split-suite-workflow.mutations.py
      - name: PR lane v2 workflow (job-private NuGet folders, opt-in)
        run: python3 governance/tests/pr-lane-v2-workflow.test.py
      - name: PR lane v2 workflow, mutation proof
        run: python3 governance/tests/pr-lane-v2-workflow.mutations.py
      - name: PR lane v2 speed switches (SDK pin, background static checks)
        run: python3 governance/tests/pr-lane-v2-speed.test.py
      - name: PR lane v2 speed switches, mutation proof
        run: python3 governance/tests/pr-lane-v2-speed.mutations.py
      - name: PR lane docs-only classification (a long file list is never docs-only)
        run: python3 governance/tests/docs-only-classification.test.py
      - name: PR lane docs-only classification, mutation proof
        run: python3 governance/tests/docs-only-classification.mutations.py
      - name: PR gate v3 (lane, plan, test shards and the verdict)
        run: python3 governance/tests/pr-gate-v3.test.py
      - name: PR gate v3, mutation proof
        run: python3 governance/tests/pr-gate-v3.mutations.py
      - name: PR gate v4 (self-hosted only, runner inputs, per-shard runners, hosted refusal)
        run: python3 governance/tests/pr-gate-v4.test.py
      - name: PR gate v4, mutation proof
        run: python3 governance/tests/pr-gate-v4.mutations.py
      - name: shellcheck
        run: shellcheck governance/bootstrap.sh governance/identity/*.sh
      - name: identity manifests parse
        run: for f in governance/identity/*.manifest.json; do python3 -m json.tool "$f" >/dev/null; done
      - name: YAML parses
        run: |
          python3 - <<'EOF'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob('.github/**/*.yml', recursive=True)):
              try:
                  yaml.safe_load(open(f))
              except Exception as e:
                  print(f'{f}: {e}'); bad += 1
          sys.exit(bad)
          EOF
